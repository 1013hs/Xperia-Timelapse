name: Build Xperia Timelapse APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 JDK 17 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 自动配置并生成最新版 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: 生成 Gradle Wrapper
        run: gradle wrapper

      - name: 设置 Executable 权限
        run: chmod +x ./gradlew

      - name: 编译 Debug 版本的 APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 上传打包好的 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: Xperia-Timelapse-App
          path: app/build/outputs/apk/debug/app-debug.apk
