name: Build Xperia Timelapse APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 JDK 17 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 自动安装 Gradle 并生成 Wrapper
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper

      - name: 设置 Gradle 权限
        run: chmod +x ./gradlew

      - name: 编译 Debug 版本的 APK
        run: ./gradlew assembleDebug

      - name: 上传打包好的 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: Xperia-Timelapse-App
          path: app/build/outputs/apk/debug/app-debug.apk
